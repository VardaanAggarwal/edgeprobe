name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Unit tests, local HTTP/HTTPS server tests, and API integration tests against
      # PostgreSQL in Docker (Testcontainers; Docker is available on GitHub's Ubuntu runners).
      - name: Build and test
        run: ./mvnw -B verify

      - name: CLI smoke test
        run: java -jar edgeprobe-cli/target/edgeprobe.jar --version

      - name: Build API image
        run: docker build -t edgeprobe-api:ci .
