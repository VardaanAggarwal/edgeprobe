spring:
  application:
    name: edgeprobe
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edgeprobe}
    username: ${DB_USER:edgeprobe}
    password: ${DB_PASSWORD:edgeprobe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

edgeprobe:
  probe:
    connect-timeout: 5s
    request-timeout: 8s
    overall-timeout: 15s
    max-redirects: 5
    allow-private-targets: false
    threads: 24
  cache:
    ttl: 5m
    max-entries: 10000
  rate-limit:
    enabled: true
    capacity: 10
    refill-period: 6s
